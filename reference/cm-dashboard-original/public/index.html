function parseGvizDate(val) {
  if(!val) return "";
  const s = String(val).trim();
  // gviz format: Date(2026,4,13,9,15,0) — month is 0-indexed
  const m = s.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
  if(m) {
    const y=m[1], mo=String(+m[2]+1).padStart(2,"0"), d=String(m[3]).padStart(2,"0");
    const h=m[4]?String(m[4]).padStart(2,"0"):"00", mn=m[5]?String(m[5]).padStart(2,"0"):"00";
    return `${y}-${mo}-${d}T${h}:${mn}`;
  }
  // dd/mm/yyyy hoặc dd/mm/yy (format Google Sheets Việt Nam)
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(dmy) {
    const d=String(dmy[1]).padStart(2,"0"), mo=String(dmy[2]).padStart(2,"0");
    const y=dmy[3].length===2?"20"+dmy[3]:dmy[3];
    return `${y}-${mo}-${d}`;
  }
  // yyyy-mm-dd (ISO) hoặc yyyy/mm/dd
  const iso = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(iso) {
    const y=iso[1], mo=String(iso[2]).padStart(2,"0"), d=String(iso[3]).padStart(2,"0");
    return `${y}-${mo}-${d}`;
  }
  return s;
}

function parseSheetData(values) {
  if(!values||values.length<2) return [];
  const headers = values[0].map(h=>String(h).trim().toLowerCase()
    .replace(/\s+/g,"_")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // strip diacritics for matching
  );
  // Log headers for debugging
  console.log("[Sheet] Headers found:", headers);
  return values.slice(1).map(row=>{
    const obj={};
    headers.forEach((h,i)=>{obj[h]=row[i]!==undefined&&row[i]!==null?row[i]:"";});
    // Map sheet columns to dashboard fields
    const mapped = {
      key:       String(obj.issue_key||obj.key||obj.ma_task||obj.ma||""),
      loai:      String(obj.loai||obj.loai_task||""),
      doi_tuong: String(obj.doi_tuong||obj.doi_tuong_task||""),
      nhom:      String(obj.nhom||obj.nhom_cong_viec||""),
      hang_muc:  String(obj.hang_muc||""),
      hang_muc_chuan: String(obj.hang_muc_chuan||""),
      hang_muc_con:   String(obj.hang_muc_con||""),
      assignee:  String(obj.assignee||obj.nguoi_thuc_hien||obj.nguoi_th||"Unassigned"),
      status:    String(obj.status||obj.trang_thai||""),
      due:       parseGvizDate(obj.due_date||obj.due||obj.han||obj.han_xu_ly||""),
      updated:   parseGvizDate(obj.updated||obj.ngay_cap_nhat||obj.cap_nhat||"") || parseGvizDate(obj.ngay_tao||obj.ngay_tao_||""),
      note:      String(obj.note||obj.description||obj.ghi_chu||""),
      work_type: String(obj.work_type||obj.worktype||obj.work_type||""),
    };
    return mapped;
  }).filter(d=>!!d.key);
}

async function fetchSheetData() {
  // ── Doc tu data.json (sinh boi GitLab CI/CD sync.js) thay cho Google Sheets ──
  try {
    const resp = await fetch(DATA_JSON_URL + "?t=" + Date.now()); // cache-bust
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const json = await resp.json();

    console.log("[Dashboard] data.json:", json.count, "issues · synced:", json.lastSync);

    // data.json da co dung 14 truong — chi chuan hoa date
    return (json.data || []).map(d => ({
      key:            String(d.key || ""),
      loai:           String(d.loai || ""),
      doi_tuong:      String(d.doi_tuong || ""),
      nhom:           String(d.nhom || ""),
      hang_muc:       String(d.hang_muc || ""),
      hang_muc_chuan: String(d.hang_muc_chuan || ""),
      hang_muc_con:   String(d.hang_muc_con || ""),
      assignee:       String(d.assignee || "Unassigned"),
      status:         String(d.status || ""),
      due:            parseGvizDate(d.due || ""),
      created:        parseGvizDate(d.created || ""),
      updated:        parseGvizDate(d.updated || "") || parseGvizDate(d.created || ""),
      note:           String(d.note || ""),
      work_type:      String(d.work_type || ""),
      resolved_date:  parseGvizDate(d.resolved_date || ""),
    })).filter(d => !!d.key);
  } catch (err) {
    console.error("data.json Error:", err);
    return [];
  }
}

function getCompletionRate(tasks, statusGroups) {
  const cancelledSt = (statusGroups.find(g=>g.id==="pending")?.jiraStatuses||[]).filter(s=>s.toLowerCase().includes("cancel"));
  const valid = tasks.filter(t=>!cancelledSt.some(s=>s.toLowerCase()===t.status.toLowerCase()));
  const closedSt = statusGroups.find(g=>g.id==="closed")?.jiraStatuses||[];
  const done = valid.filter(t=>closedSt.some(s=>s.toLowerCase()===t.status.toLowerCase()));
  return valid.length ? Math.round(done.length/valid.length*100) : 0;
}

function getGroupForStatus(status, groups) {
  for(const g of groups) if(g.jiraStatuses.some(s=>s.toLowerCase()===status.toLowerCase())) return g;
  return null;
}

function getBucket(iso,unit){const d=new Date(iso);if(unit==="hour")return`${pad(d.getHours())}h`;if(unit==="day")return`${pad(d.getDate())}/${pad(d.getMonth()+1)}`;return`T${pad(d.getMonth()+1)}`;}
function genBuckets(s,e,unit){const r=[],seen=new Set(),cur=new Date(s);while(cur<=e&&r.length<48){const k=getBucket(cur.toISOString(),unit);if(!seen.has(k)){seen.add(k);r.push(k);}if(unit==="hour")cur.setHours(cur.getHours()+1);else if(unit==="day")cur.setDate(cur.getDate()+1);else cur.setMonth(cur.getMonth()+1);}return r;}

function TaskCard({task,cfg,today,onRemove,compact}){
  const C=cfg.colors;
  const grp=getGroupForStatus(task.status,cfg.statusGroups);
  const todayMs=parseDate(today).getTime(),dueMs=parseDate(task.due).getTime();
  const diffD=Math.round((dueMs-todayMs)/86400000);
  const isClosed=grp?.id==="closed",isPending=grp?.id==="pending";
  const od=diffD<0&&!isClosed;
  const dueColor=od?C.danger:isClosed?(grp?.color||"#34D399"):diffD<=3?"#FBBF24":"var(--text-2)";
  const dueLabel=isClosed?"Đã hoàn thành":od?`Trễ ${-diffD} ngày`:diffD===0?"Đến hạn hôm nay":diffD===1?"Còn 1 ngày":`Còn ${diffD} ngày`;
  const avtIdx=task.assignee.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const avtColor=AVT_COLORS[avtIdx%AVT_COLORS.length];
  const progressMap={open:5,inprogress:55,closed:100,pending:30};
  const progress=grp?progressMap[grp.id]||0:0;
  const stages=cfg.statusGroups.filter(g=>g.id!=="pending");
  const currentIdx=stages.findIndex(g=>g.id===grp?.id);
  return(<div style={{position:"relative",background:`linear-gradient(135deg, ${(grp?.color||C.accent)}10, ${C.surface})`,boxShadow:"0 2px 8px rgba(var(--shadow-rgb),.28), inset 0 0 0 1px var(--fg-05)",borderRadius:14,padding:"14px 16px 16px",overflow:"hidden",transition:"all .2s"}}>
    <div aria-hidden style={{position:"absolute",top:0,left:0,bottom:0,width:3,background:grp?.color||"var(--text-dim)",borderRadius:"14px 0 0 14px"}}/>
    {onRemove&&<button onClick={onRemove} title="Bỏ task này" style={{position:"absolute",top:10,right:10,width:22,height:22,borderRadius:"50%",background:"var(--fg-06)",border:"none",color:"var(--text-muted)",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}>✕</button>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:10,paddingRight:onRemove?22:0}}>
      <div style={{minWidth:0,flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
          <span style={{fontSize:9,fontWeight:700,letterSpacing:"0.5px",color:"var(--text-5)",fontFamily:"monospace"}}>{task.key}</span>
          <span style={{padding:"1px 6px",borderRadius:8,fontSize:9,fontWeight:700,background:task.loai==="Squad"?`${C.squad}18`:task.loai==="Du_an"?`${C.duan}18`:`${C.vanhoa}18`,color:task.loai==="Squad"?C.squad:task.loai==="Du_an"?C.duan:C.vanhoa}}>{cfg.ui.loaiNames[task.loai]||task.loai}</span>
        </div>
        <div style={{fontSize:13,fontWeight:700,color:"var(--text-bright)",lineHeight:1.3,letterSpacing:"-0.1px",overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{task.hang_muc}</div>
        <div style={{fontSize:10,color:"var(--text-5)",marginTop:3}}>{task.doi_tuong} · {cfg.nhomLabels[task.nhom]||task.nhom}</div>
      </div>
      {grp&&<span style={{padding:"3px 9px",borderRadius:12,fontSize:10,fontWeight:700,background:`${grp.color}1F`,color:grp.color,border:`1px solid ${grp.color}45`,whiteSpace:"nowrap",flexShrink:0}}>{grp.icon} {grp.label}</span>}
    </div>
    <div style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
        <span style={{fontSize:9,color:"var(--text-5)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.7px"}}>Tiến độ</span>
        <span style={{fontSize:11,fontWeight:700,color:grp?.color||"var(--text-2)"}}>{progress}%</span>
      </div>
      <div style={{height:6,background:"var(--fg-05)",borderRadius:3,overflow:"hidden",position:"relative"}}>
        <div style={{height:"100%",width:`${progress}%`,background:`linear-gradient(90deg, ${grp?.color||"var(--text-dim)"}, ${grp?.color||"var(--text-dim)"}BB)`,borderRadius:3,transition:"width .5s"}}/>
      </div>
      {!isPending&&currentIdx>=0&&<div style={{display:"flex",justifyContent:"space-between",marginTop:6,gap:4}}>{stages.map((s,i)=>{const active=i<=currentIdx;return(<div key={s.id} style={{flex:1,textAlign:"center"}}><div style={{fontSize:8,color:active?s.color:"var(--text-dimmer)",fontWeight:active?700:500,textTransform:"uppercase",letterSpacing:"0.4px"}}>{s.label}</div></div>);})}</div>}
      {isPending&&<div style={{marginTop:6,fontSize:10,color:grp.color,fontWeight:600,textAlign:"center"}}>⏸ Đang tạm hoãn / huỷ</div>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      <div style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",background:"var(--fg-03)",borderRadius:9}}>
        <div style={{width:32,height:32,borderRadius:"50%",background:avtColor,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",flexShrink:0,boxShadow:`0 2px 6px ${avtColor}55`}}>{task.assignee.slice(0,2)}</div>
        <div style={{minWidth:0}}>
          <div style={{fontSize:9,color:"var(--text-5)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px"}}>Người thực hiện</div>
          <div style={{fontSize:12,color:"var(--text)",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{task.assignee}</div>
        </div>
      </div>
      <div style={{padding:"8px 10px",background:`${dueColor}0E`,border:`1px solid ${dueColor}28`,borderRadius:9}}>
        <div style={{fontSize:9,color:"var(--text-5)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:2}}>Hạn</div>
        <div style={{display:"flex",alignItems:"baseline",gap:6,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:"var(--text)",fontWeight:700,lineHeight:1}}>{task.due.slice(8,10)}/{task.due.slice(5,7)}</span>
          <span style={{fontSize:10,color:dueColor,fontWeight:700,lineHeight:1}}>{dueLabel}</span>
        </div>
      </div>
    </div>
    {task.note&&!compact&&<div style={{marginTop:10,padding:"7px 10px",background:"rgba(123,158,255,0.04)",borderLeft:"2px solid rgba(123,158,255,0.25)",borderRadius:"0 8px 8px 0",fontSize:10,color:"var(--text-3)",lineHeight:1.45,fontStyle:"italic"}}>💬 {task.note}</div>}
  </div>);
}

function TaskDetailPanel({tasks,cfg,today,onClear,onRemove}){

      <div style={{width:48,height:48,margin:"0 auto 12px",borderRadius:12,background:"rgba(123,158,255,0.06)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,opacity:.7}}>📋</div>

      <div style={{fontSize:11,color:"var(--text-dim)",maxWidth:340,margin:"0 auto",lineHeight:1.5}}>Click vào một dòng trong bảng để xem chi tiết · Tick checkbox để so sánh tối đa 6 task cùng lúc</div>

function DrillBanner({drill,data,onClose,onViewAll,accent}){
  if(!drill)return null;
  const tasks=data.filter(d=>drill.type==="assignee"?d.assignee===drill.key:drill.type==="hang_muc"?d.hang_muc===drill.key:drill.type==="hang_muc_chuan"?d.hang_muc_chuan===drill.key:false);
  const closed=tasks.filter(t=>t._grp&&t._grp.id==="closed").length;
  const pct=tasks.length?Math.round(closed/tasks.length*100):0;
  return(<div style={{position:"absolute",zIndex:150,background:"var(--surface-hi)",border:"1px solid var(--fg-12)",borderRadius:12,padding:"14px 16px",minWidth:300,maxWidth:380,boxShadow:"0 12px 40px rgba(var(--shadow-rgb),.7)",top:40,left:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
      <div><div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:3}}>{drill.label}</div><div style={{display:"flex",gap:8}}><span style={{fontSize:11,color:"var(--text-4)"}}>{tasks.length} tasks</span><span style={{fontSize:11,fontWeight:600,color:"#34D399"}}>{pct}% HT</span></div></div>
      <button onClick={onClose} style={{background:"var(--fg-05)",border:"none",borderRadius:6,color:"var(--text-4)",cursor:"pointer",width:24,height:24,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>x</button>
    </div>
    <div style={{maxHeight:180,overflowY:"auto"}}>{tasks.slice(0,6).map((t,i)=><div key={t.key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"5px 0",borderBottom:i<Math.min(tasks.length,6)-1?"1px solid var(--fg-04)":"none"}}><div style={{flex:1,minWidth:0}}><div style={{fontSize:11,color:"var(--text-hd)",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.hang_muc||t.key}</div><div style={{fontSize:10,color:"var(--text-dim)"}}>{t.key} - {t.assignee}</div></div>{t._grp&&<span style={{marginLeft:6,padding:"2px 6px",borderRadius:8,fontSize:9,fontWeight:700,background:t._grp.color+"18",color:t._grp.color,flexShrink:0}}>{t._grp.label}</span>}</div>)}</div>
    {tasks.length>6&&<div style={{marginTop:8,paddingTop:8,borderTop:"1px solid var(--fg-06)",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:10,color:"var(--text-dimmer)"}}>+{tasks.length-6} khac</span><button onClick={()=>onViewAll(drill)} style={{fontSize:10,color:accent,cursor:"pointer",background:"none",border:"none",fontWeight:600}}>Xem tat ca</button></div>}
  </div>);
}

function exportToExcel(rows,filename){
  const H=["Issue Key","Work Type","Loai","Doi tuong","Nhom","Hang muc","HM Chuan","HM Con","Status","Assignee","Due Date","Note","Updated"];
  const csv=[H,...rows.map(d=>[d.key,d.work_type,d.loai,d.doi_tuong,d.nhom,d.hang_muc,d.hang_muc_chuan,d.hang_muc_con,d.status,d.assignee,d.due,d.note,d.updated])].map(r=>r.map(c=>'"'+(String(c||"").replace(/"/g,'""'))+'"').join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}

function TimelineView({tasks,C,cfg,getGrp,onSelect}){
  if(!tasks.length)return(<div style={{padding:"40px",textAlign:"center",color:"var(--text-4)",fontSize:12}}>Không có task để hiển thị timeline</div>);
  const today=new Date(TODAY);let mn=today.getTime(),mx=today.getTime();
  tasks.forEach(t=>{const cr=t.created?new Date(t.created).getTime():null;const du=t.due?new Date(t.due).getTime():null;if(cr){mn=Math.min(mn,cr);mx=Math.max(mx,cr);}if(du){mn=Math.min(mn,du);mx=Math.max(mx,du);}});
  const pad=(mx-mn)*0.04||864e5;mn-=pad;mx+=pad;const span=mx-mn||1;
  const pct=ts=>((ts-mn)/span*100);
  const lc=l=>l==="Squad"?C.squad:l==="Du_an"?C.duan:C.vanhoa;
  const todayPct=pct(today.getTime());
  const ticks=[];const d0=new Date(mn);d0.setDate(1);for(let dd=new Date(d0);dd.getTime()<=mx;dd.setMonth(dd.getMonth()+1))ticks.push(new Date(dd));
  const sorted=[...tasks].sort((a,b)=>(a.due?new Date(a.due).getTime():mx)-(b.due?new Date(b.due).getTime():mx)).slice(0,60);
  const LBL=180;
  return(<div style={{padding:"10px 14px 14px"}}>
    <div style={{display:"flex",gap:14,marginBottom:12,flexWrap:"wrap",fontSize:10,color:"var(--text-4)"}}>
      {[["Squad",C.squad],["Dự án",C.duan],["Văn hóa",C.vanhoa],["Trễ hạn","#FB7185"]].map(([l,cc])=><span key={l} style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:3,background:cc}}/>{l}</span>)}
      <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:2,height:11,background:"#FB7185"}}/>Hôm nay</span>
    </div>
    <div style={{position:"relative"}}>
      <div style={{position:"relative",marginLeft:LBL,height:16,marginBottom:6}}>{ticks.map((t,i)=><span key={i} style={{position:"absolute",left:`${pct(t.getTime())}%`,fontSize:9,color:"var(--text-5)",transform:"translateX(-50%)",whiteSpace:"nowrap",fontWeight:600}}>T{t.getMonth()+1}</span>)}</div>
      <div style={{position:"relative"}}>
        {todayPct>=0&&todayPct<=100&&<div style={{position:"absolute",left:`calc(${LBL}px + (100% - ${LBL}px) * ${todayPct} / 100)`,top:0,bottom:0,width:2,background:"#FB7185",opacity:.55,zIndex:2,pointerEvents:"none"}}/>}
        {sorted.map(t=>{
          const cr=t.created?new Date(t.created).getTime():(t.due?new Date(t.due).getTime():mn);
          const du=t.due?new Date(t.due).getTime():cr;
          const l=Math.max(0,pct(Math.min(cr,du))),w=Math.max(1.5,pct(Math.max(cr,du))-pct(Math.min(cr,du)));
          const overdue=t.due&&new Date(t.due)<today&&getGrp(t.status)?.id!=="closed";
          const done=getGrp(t.status)?.id==="closed";const col=overdue?"#FB7185":lc(t.loai);
          return(<div key={t.key} onClick={()=>onSelect&&onSelect(t)} style={{display:"grid",gridTemplateColumns:`${LBL}px 1fr`,alignItems:"center",height:27,cursor:"pointer",borderRadius:6}} onMouseEnter={e=>e.currentTarget.style.background="var(--fg-03)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <div style={{display:"flex",alignItems:"center",gap:6,paddingRight:10,overflow:"hidden"}}><span style={{fontSize:10,fontWeight:700,color:lc(t.loai),flexShrink:0}}>{t.key}</span><span style={{fontSize:10,color:"var(--text-4)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.hang_muc||""}</span></div>
            <div style={{position:"relative",height:15}}><div title={t.key+" · "+(t.created||"?")+" → "+(t.due||"?")} style={{position:"absolute",left:`${l}%`,width:`${w}%`,height:15,borderRadius:7,background:done?`${col}55`:`linear-gradient(90deg,${col},${col}BB)`,border:`1px solid ${col}`,boxShadow:`0 0 8px ${col}44`,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:4,minWidth:8}}>{done&&<span style={{fontSize:9,color:"#fff",fontWeight:700}}>✓</span>}</div></div>
          </div>);
        })}
      </div>
    </div>
  </div>);
}

// ── NHÓM 4.3: Progress Ring Overview ─────────────────────────────
function ProgressRings({sRate,dRate,vRate,C}){

  const rings=[{r:R[0],pct:sRate,color:C.squad,label:"Squad"},{r:R[1],pct:dRate,color:C.duan,label:"Dự án"},{r:R[2],pct:vRate,color:C.vanhoa,label:"Văn hóa"}];

      {rings.map(rg=>(<g key={rg.label}><circle cx={cx} cy={cy} r={rg.r} fill="none" stroke="var(--fg-05)" strokeWidth={W}/><circle cx={cx} cy={cy} r={rg.r} fill="none" stroke={rg.color} strokeWidth={W} strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`} {...arc(rg.r,rg.pct)} style={{filter:`drop-shadow(0 0 6px ${rg.color}88)`,transition:"stroke-dasharray .8s cubic-bezier(.22,1,.36,1)"}}/></g>))}

// ── Command Palette (Ctrl+K / ⌘K) ───────────────────────────────
function CmdPalette({open,onClose,commands,accent}){
  const[q,setQ]=useState("");
  const[sel,setSel]=useState(0);
  const inRef=useRef(null);
  useEffect(()=>{if(open){setQ("");setSel(0);setTimeout(()=>{if(inRef.current)inRef.current.focus();},30);}},[open]);
  useEffect(()=>{setSel(0);},[q]);
  const list=(()=>{const s=q.trim().toLowerCase();if(!s)return commands.slice(0,80);return commands.filter(c=>(c.label+" "+(c.group||"")+" "+(c.hint||"")).toLowerCase().includes(s)).slice(0,80);})();
  if(!open)return null;
  const onKey=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();setSel(s=>Math.min(s+1,list.length-1));}
    else if(e.key==="ArrowUp"){e.preventDefault();setSel(s=>Math.max(s-1,0));}
    else if(e.key==="Enter"){e.preventDefault();const cc=list[sel];if(cc){cc.run();onClose();}}
    else if(e.key==="Escape"){e.preventDefault();onClose();}
  };
  return(<div onMouseDown={onClose} style={{position:"fixed",inset:0,zIndex:600,background:"rgba(5,7,16,.55)",backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)",display:"flex",alignItems:"flex-start",justifyContent:"center",paddingTop:"11vh"}}>
    <div onMouseDown={e=>e.stopPropagation()} onKeyDown={onKey} style={{width:"min(640px,92vw)",background:"var(--surface-hi)",border:`1px solid ${accent}40`,borderRadius:16,boxShadow:"0 30px 90px rgba(0,0,0,.55)",overflow:"hidden",animation:"cmdIn .18s cubic-bezier(.22,1,.36,1)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 18px",borderBottom:"1px solid var(--fg-06)"}}>
        <span style={{fontSize:15,color:accent,fontWeight:700}}>⌘</span>
        <input ref={inRef} value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm lệnh, bộ lọc, người, trạng thái..." style={{flex:1,background:"transparent",border:"none",outline:"none",color:"var(--text)",fontSize:15,fontFamily:FF}}/>
        <span style={{fontSize:9,color:"var(--text-4)",border:"1px solid var(--fg-08)",borderRadius:5,padding:"2px 6px",fontWeight:600}}>ESC</span>
      </div>
      <div style={{maxHeight:"52vh",overflowY:"auto",padding:6}}>
        {list.length===0&&<div style={{padding:"34px",textAlign:"center",color:"var(--text-4)",fontSize:12}}>Không tìm thấy lệnh phù hợp</div>}
        {list.map((cc,i)=>(<div key={i} onMouseEnter={()=>setSel(i)} onMouseDown={e=>{e.preventDefault();cc.run();onClose();}} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 12px",borderRadius:10,cursor:"pointer",background:sel===i?`${accent}1F`:"transparent",border:sel===i?`1px solid ${accent}40`:"1px solid transparent"}}>
          <span style={{fontSize:14,width:22,textAlign:"center"}}>{cc.icon}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,color:"var(--text)",fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{cc.label}</div>
            {cc.hint&&<div style={{fontSize:10,color:"var(--text-4)"}}>{cc.hint}</div>}
          </div>
          {cc.group&&<span style={{fontSize:9,color:"var(--text-5)",textTransform:"uppercase",letterSpacing:".5px",background:"var(--fg-04)",padding:"2px 7px",borderRadius:20,whiteSpace:"nowrap",flexShrink:0}}>{cc.group}</span>}
        </div>))}
      </div>
      <div style={{display:"flex",gap:16,padding:"8px 16px",borderTop:"1px solid var(--fg-06)",fontSize:10,color:"var(--text-5)"}}>
        <span>↑↓ di chuyển</span><span>↵ chọn</span><span>esc đóng</span>
      </div>
    </div>
  </div>);
}
