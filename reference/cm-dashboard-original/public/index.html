function getOverdueColor(dueDate,status,closedStatuses){
  if(!dueDate||(closedStatuses||[]).some(st=>st.toLowerCase()===(status||"").toLowerCase()))return null;
  const diff=Math.floor((new Date(TODAY)-new Date(dueDate))/86400000);
  if(diff<=0)return null;
  if(diff<=3)return"#FBBF24";
  if(diff<=7)return"#F97316";
  return"#FB7185";
}

function triggerRipple(e,color){const el=e.currentTarget;const rect=el.getBoundingClientRect();const x=e.clientX-rect.left;const y=e.clientY-rect.top;const rip=document.createElement("span");rip.style.cssText=`position:absolute;left:${x-60}px;top:${y-60}px;width:120px;height:120px;border-radius:50%;background:${color||"rgba(167,139,250,0.35)"};pointer-events:none;transform:scale(0);animation:rippleExpand .4s ease-out forwards;z-index:999`;el.appendChild(rip);setTimeout(()=>rip.parentNode&&rip.parentNode.removeChild(rip),450);}

function parseGvizDate(val) {
  if(!val) return "";
  const s = String(val).trim();
  // gviz format: Date(2026,4,13,9,15,0) — month is 0-indexed
  const m = s.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
  if(m) {
    const y=m[1], mo=String(+m[2]+1).padStart(2,"0"), d=String(m[3]).padStart(2,"0");
    const h=m[4]?String(m[4]).padStart(2,"0"):"00", mn=m[5]?String(m[5]).padStart(2,"0"):"00";
    return `${y}-${mo}-${d}T${h}:${mn}`;
  }
  // dd/mm/yyyy hoặc dd/mm/yy (format Google Sheets Việt Nam)
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(dmy) {
    const d=String(dmy[1]).padStart(2,"0"), mo=String(dmy[2]).padStart(2,"0");
    const y=dmy[3].length===2?"20"+dmy[3]:dmy[3];
    return `${y}-${mo}-${d}`;
  }
  // yyyy-mm-dd (ISO) hoặc yyyy/mm/dd
  const iso = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(iso) {
    const y=iso[1], mo=String(iso[2]).padStart(2,"0"), d=String(iso[3]).padStart(2,"0");
    return `${y}-${mo}-${d}`;
  }
  return s;
}

function parseSheetData(values) {
  if(!values||values.length<2) return [];
  const headers = values[0].map(h=>String(h).trim().toLowerCase()
    .replace(/\s+/g,"_")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // strip diacritics for matching
  );
  // Log headers for debugging
  console.log("[Sheet] Headers found:", headers);
  return values.slice(1).map(row=>{
    const obj={};
    headers.forEach((h,i)=>{obj[h]=row[i]!==undefined&&row[i]!==null?row[i]:"";});
    // Map sheet columns to dashboard fields
    const mapped = {
      key:       String(obj.issue_key||obj.key||obj.ma_task||obj.ma||""),
      loai:      String(obj.loai||obj.loai_task||""),
      doi_tuong: String(obj.doi_tuong||obj.doi_tuong_task||""),
      nhom:      String(obj.nhom||obj.nhom_cong_viec||""),
      hang_muc:  String(obj.hang_muc||""),
      hang_muc_chuan: String(obj.hang_muc_chuan||""),
      hang_muc_con:   String(obj.hang_muc_con||""),
      assignee:  String(obj.assignee||obj.nguoi_thuc_hien||obj.nguoi_th||"Unassigned"),
      status:    String(obj.status||obj.trang_thai||""),
      due:       parseGvizDate(obj.due_date||obj.due||obj.han||obj.han_xu_ly||""),
      updated:   parseGvizDate(obj.updated||obj.ngay_cap_nhat||obj.cap_nhat||"") || parseGvizDate(obj.ngay_tao||obj.ngay_tao_||""),
      note:      String(obj.note||obj.description||obj.ghi_chu||""),
      work_type: String(obj.work_type||obj.worktype||obj.work_type||""),
    };
    return mapped;
  }).filter(d=>!!d.key);
}

async function fetchSheetData() {
  // ── Doc tu data.json (sinh boi GitLab CI/CD sync.js) thay cho Google Sheets ──
  try {
    const resp = await fetch(DATA_JSON_URL + "?t=" + Date.now()); // cache-bust
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const json = await resp.json();

    console.log("[Dashboard] data.json:", json.count, "issues · synced:", json.lastSync);

    // data.json da co dung 14 truong — chi chuan hoa date
    return (json.data || []).map(d => ({
      key:            String(d.key || ""),
      loai:           String(d.loai || ""),
      doi_tuong:      String(d.doi_tuong || ""),
      nhom:           String(d.nhom || ""),
      hang_muc:       String(d.hang_muc || ""),
      hang_muc_chuan: String(d.hang_muc_chuan || ""),
      hang_muc_con:   String(d.hang_muc_con || ""),
      assignee:       String(d.assignee || "Unassigned"),
      status:         String(d.status || ""),
      due:            parseGvizDate(d.due || ""),
      created:        parseGvizDate(d.created || ""),
      updated:        parseGvizDate(d.updated || "") || parseGvizDate(d.created || ""),
      note:           String(d.note || ""),
      work_type:      String(d.work_type || ""),
      resolved_date:  parseGvizDate(d.resolved_date || ""),
    })).filter(d => !!d.key);
  } catch (err) {
    console.error("data.json Error:", err);
    return [];
  }
}

function getCompletionRate(tasks, statusGroups) {
  const cancelledSt = (statusGroups.find(g=>g.id==="pending")?.jiraStatuses||[]).filter(s=>s.toLowerCase().includes("cancel"));
  const valid = tasks.filter(t=>!cancelledSt.some(s=>s.toLowerCase()===t.status.toLowerCase()));
  const closedSt = statusGroups.find(g=>g.id==="closed")?.jiraStatuses||[];
  const done = valid.filter(t=>closedSt.some(s=>s.toLowerCase()===t.status.toLowerCase()));
  return valid.length ? Math.round(done.length/valid.length*100) : 0;
}

function getGroupForStatus(status, groups) {
  for(const g of groups) if(g.jiraStatuses.some(s=>s.toLowerCase()===status.toLowerCase())) return g;
  return null;
}

const pad=n=>String(n).padStart(2,"0");
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtD=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const parseDate=s=>new Date(s+"T00:00:00");
const diffDays=(a,b)=>Math.round((b-a)/86400000);
const getUnit=days=>days<=1?"hour":days<=90?"day":"month";
const getUnitLabel=u=>({hour:"Giờ",day:"Ngày",month:"Tháng"}[u]);
function getBucket(iso,unit){const d=new Date(iso);if(unit==="hour")return`${pad(d.getHours())}h`;if(unit==="day")return`${pad(d.getDate())}/${pad(d.getMonth()+1)}`;return`T${pad(d.getMonth()+1)}`;}
function genBuckets(s,e,unit){const r=[],seen=new Set(),cur=new Date(s);while(cur<=e&&r.length<48){const k=getBucket(cur.toISOString(),unit);if(!seen.has(k)){seen.add(k);r.push(k);}if(unit==="hour")cur.setHours(cur.getHours()+1);else if(unit==="day")cur.setDate(cur.getDate()+1);else cur.setMonth(cur.getMonth()+1);}return r;}

function Donut({pct,color,size=56}){const r=20,c=28,ci=2*Math.PI*r,d=ci*pct/100;const gid="dnt"+color.replace(/[^a-z0-9]/gi,"");return(<svg width={size} height={size} viewBox="0 0 56 56"><defs><linearGradient id={gid} x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={color}/><stop offset="100%" stopColor={color} stopOpacity=".45"/></linearGradient></defs><circle cx={c} cy={c} r={r} fill="none" stroke="var(--fg-06)" strokeWidth={6}/><circle cx={c} cy={c} r={r} fill="none" stroke={`url(#${gid})`} strokeWidth={6} strokeDasharray={`${d} ${ci-d}`} strokeLinecap="round" transform="rotate(-90 28 28)" style={{transition:"stroke-dasharray .7s ease",filter:`drop-shadow(0 0 6px ${color}AA)`}}/><text x="28" y="32" textAnchor="middle" fontSize="10" fontWeight="700" fill={color} style={{filter:`drop-shadow(0 0 4px ${color}88)`}}>{pct}%</text></svg>);}
function Sparkline({data,color,fill}){if(!data||data.length<2)return<div style={{width:96,height:38}}/>;const vals=data.map(d=>d.v),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;const W=96,H=38,pad=4;const xs=i=>i/(vals.length-1)*W,ys=v=>H-pad-(v-mn)/rng*(H-pad*2);const pts=vals.map((v,i)=>`${xs(i)},${ys(v)}`).join(" ");const gid="spk"+color.replace(/[^a-z0-9]/gi,"")+(fill?"f":"");const lx=xs(vals.length-1),ly=ys(vals[vals.length-1]);const area=`${pts} ${W},${H} 0,${H}`;return(<svg width={W} height={H} style={{overflow:"visible"}}><defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity={fill?.55:0}/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>{fill&&<polygon points={area} fill={`url(#${gid})`}/>}<polyline points={pts} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/><circle cx={lx} cy={ly} r="3.5" fill={color}/><circle cx={lx} cy={ly} r="8" fill={color} opacity=".25"/></svg>);}

// ── Tooltip định nghĩa ──────────────────────────────────────
function Tip({text,children,w=220}){const[show,setShow]=useState(false);const[pos,setPos]=useState({x:0,y:0});const ref=useRef(null);const handleEnter=e=>{const r=ref.current?.getBoundingClientRect();if(r)setPos({x:r.left+r.width/2,y:r.top});setShow(true);};return(<span ref={ref} onMouseEnter={handleEnter} onMouseLeave={()=>setShow(false)} style={{position:"relative",cursor:"help"}}>{children}{show&&<div style={{position:"fixed",left:Math.min(pos.x-w/2,window.innerWidth-w-12),top:pos.y-8,transform:"translateY(-100%)",zIndex:9999,background:"var(--elevated)",border:"1px solid rgba(129,140,248,.35)",borderRadius:10,padding:"9px 13px",maxWidth:w,fontSize:11,color:"#D4D4E0",lineHeight:1.5,boxShadow:"0 8px 32px rgba(0,0,0,.5)",pointerEvents:"none",animation:"fadeUp .15s ease"}}><div style={{fontSize:9,color:"#A78BFA",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:4}}>Định nghĩa</div>{text}</div>}</span>);}

// ── Count-up animation hook ──────────────────────────────────
function useCountUp(target,duration=800){const[val,setVal]=useState(0);const prev=useRef(0);useEffect(()=>{if(target===prev.current)return;const start=prev.current,diff=target-start,startTime=performance.now();const step=now=>{const p=Math.min((now-startTime)/duration,1);const ease=1-Math.pow(1-p,3);setVal(Math.round(start+diff*ease));if(p<1)requestAnimationFrame(step);else{prev.current=target;setVal(target);}};requestAnimationFrame(step);},[target]);return val;}

function CalMonth({year,month,selStart,selEnd,hover,onDay,onHover,accent,allowFuture}){const first=new Date(year,month,1),last=new Date(year,month+1,0);const dow=(first.getDay()+6)%7;const cells=[...Array(dow).fill(null),...Array.from({length:last.getDate()},(_,i)=>new Date(year,month,i+1))];return(<div style={{minWidth:200}}><div style={{textAlign:"center",fontWeight:700,fontSize:12,color:"var(--text-hd)",marginBottom:10}}>{MONTHS_VI[month]} {year}</div><div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>{["T2","T3","T4","T5","T6","T7","CN"].map(d=><div key={d} style={{textAlign:"center",fontSize:9,color:"var(--text-dimmer)",fontWeight:600,padding:"3px 0"}}>{d}</div>)}</div><div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>{cells.map((d,i)=>{if(!d)return<div key={i}/>;const ds=fmt(d),isSt=selStart&&fmt(parseDate(selStart))===ds,isEn=selEnd&&fmt(parseDate(selEnd))===ds,inRng=selStart&&(selEnd||hover)&&ds>=selStart&&ds<=(selEnd||hover),isFut=!allowFuture&&d>new Date(TODAY);return(<div key={i} onClick={()=>!isFut&&onDay(ds)} onMouseEnter={()=>!isFut&&onHover(ds)} style={{textAlign:"center",padding:"5px 1px",borderRadius:5,fontSize:11,cursor:isFut?"default":"pointer",background:isSt||isEn?accent:inRng?`${accent}25`:"transparent",color:isSt||isEn?"#fff":isFut?"var(--text-faint)":inRng?accent:"var(--text-3)",fontWeight:isSt||isEn?700:400}}>{d.getDate()}</div>);})}</div></div>);}
function DatePicker({start,end,onApply,onClose,accent,allowFuture}){const[sel,setSel]=useState({start,end});const[hover,setHover]=useState(null);const[phase,setPhase]=useState(!end?"end":"start");const[lm,setLm]=useState(4);const[ly,setLy]=useState(2026);const rm=lm===11?0:lm+1,ry=lm===11?ly+1:ly;const days=sel.start&&sel.end?diffDays(parseDate(sel.start),parseDate(sel.end))+1:null;const handleDay=ds=>{if(phase==="start"){setSel({start:ds,end:null});setPhase("end");}else{setSel(p=>({start:ds<p.start?ds:p.start,end:ds<p.start?p.start:ds}));setPhase("start");}};const _td=new Date(TODAY),_ty=_td.getFullYear(),_tm=_td.getMonth();const _tms=fmt(new Date(_ty,_tm,1)),_tme=fmt(new Date(_ty,_tm+1,0));const _pms=fmt(new Date(_ty,_tm-1,1)),_pme=fmt(new Date(_ty,_tm,0));const _nms=fmt(new Date(_ty,_tm+1,1)),_nme=fmt(new Date(_ty,_tm+2,0));const _7l=fmt(new Date(_td.getTime()+7*864e5));const _tq=Math.floor(_tm/3);const _tqs=fmt(new Date(_ty,_tq*3,1)),_tqe=fmt(new Date(_ty,_tq*3+3,0));const _nqs=fmt(new Date(_ty,(_tq+1)*3,1)),_nqe=fmt(new Date(_ty,(_tq+1)*3+3,0));const P=allowFuture?[{l:"7N tới",s:TODAY,e:_7l},{l:"Tháng này",s:_tms,e:_tme},{l:"Tháng sau",s:_nms,e:_nme},{l:"Quý này",s:_tqs,e:_tqe},{l:"Quý sau",s:_nqs,e:_nqe},{l:"Năm nay",s:_ty+"-01-01",e:_ty+"-12-31"},{l:"6 tháng tới",s:TODAY,e:fmt(new Date(_td.getTime()+180*864e5))},{l:"Tất cả",s:"2024-01-01",e:"2027-12-31"}]:[{l:"7N tới",s:TODAY,e:_7l},{l:"Hôm nay",s:TODAY,e:TODAY},{l:"7 ngày",s:fmt(new Date(_td.getTime()-6*864e5)),e:TODAY},{l:"30 ngày",s:fmt(new Date(_td.getTime()-29*864e5)),e:TODAY},{l:"Tháng này",s:_tms,e:TODAY},{l:"Tháng trước",s:_pms,e:_pme},{l:"3 tháng",s:fmt(new Date(_td.getTime()-89*864e5)),e:TODAY},{l:"Năm nay",s:_ty+"-01-01",e:TODAY}];return(<div style={{position:"absolute",top:"calc(100% + 8px)",left:0,zIndex:200,background:"var(--surface-hi)",border:"1px solid var(--fg-10)",borderRadius:14,boxShadow:"0 20px 60px rgba(var(--shadow-rgb),.6)",display:"flex",minWidth:560}}><div style={{width:130,borderRight:"1px solid var(--fg-06)",padding:"14px 8px",flexShrink:0}}><div style={{fontSize:9,color:"var(--text-dimmer)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:8,paddingLeft:6}}>Nhanh</div>{P.map(p=><div key={p.l} onClick={()=>{setSel({start:p.s,end:p.e});setPhase("start");}} style={{padding:"5px 10px",borderRadius:7,fontSize:11,color:sel.start===p.s&&sel.end===p.e?accent:"var(--text-4)",cursor:"pointer",marginBottom:2,background:sel.start===p.s&&sel.end===p.e?`${accent}18`:"transparent"}}>{p.l}</div>)}</div><div style={{flex:1,padding:"14px 18px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><button onClick={()=>{if(lm===0){setLm(11);setLy(y=>y-1);}else setLm(m=>m-1);}} style={{background:"var(--fg-04)",border:"1px solid var(--fg-08)",borderRadius:6,color:"var(--text-3)",padding:"3px 9px",cursor:"pointer",fontSize:13}}>‹</button><div style={{fontSize:10,color:phase==="start"?accent:"#34D399",fontWeight:600}}>{phase==="start"?"→ Ngày bắt đầu":"→ Ngày kết thúc"}{days&&<span style={{color:"var(--text-dimmer)",marginLeft:6}}>· {days} ngày</span>}</div><button onClick={()=>{if(lm===11){setLm(0);setLy(y=>y+1);}else setLm(m=>m+1);}} style={{background:"var(--fg-04)",border:"1px solid var(--fg-08)",borderRadius:6,color:"var(--text-3)",padding:"3px 9px",cursor:"pointer",fontSize:13}}>›</button></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}><CalMonth year={ly} month={lm} selStart={sel.start} selEnd={sel.end} hover={hover} onDay={handleDay} onHover={setHover} accent={accent} allowFuture={allowFuture}/><CalMonth year={ry} month={rm} selStart={sel.start} selEnd={sel.end} hover={hover} onDay={handleDay} onHover={setHover} accent={accent} allowFuture={allowFuture}/></div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:14,paddingTop:12,borderTop:"1px solid var(--fg-06)"}}><div style={{fontSize:11,color:"var(--text-dim)"}}>{sel.start&   const dueColor=od?C.danger:isClosed?(grp?.color||"#34D399"):diffD<=3?"#FBBF24":"var(--text-2)";
  const dueLabel=isClosed?"Đã hoàn thành":od?`Trễ ${-diffD} ngày`:diffD===0?"Đến hạn hôm nay":diffD===1?"Còn 1 ngày":`Còn ${diffD} ngày`;

        <div style={{fontSize:10,color:"var(--text-5)",marginTop:3}}>{task.doi_tuong} · {cfg.nhomLabels[task.nhom]||task.nhom}</div>
      </div>

function exportToExcel(rows,filename){

// ── Timeline / Gantt view ───────────────────────────────────────
function TimelineView({tasks,C,cfg,getGrp,onSelect}){
  if(!tasks.length)return(<div style={{padding:"40px",textAlign:"center",color:"var(--text-4)",fontSize:12}}>Không có task để hiển thị timeline</div>);
  const today=new Date(TODAY);let mn=today.getTime(),mx=today.getTime();
  tasks.forEach(t=>{const cr=t.created?new Date(t.created).getTime():null;const du=t.due?new Date(t.due).getTime():null;if(cr){mn=Math.min(mn,cr);mx=Math.max(mx,cr);}if(du){mn=Math.min(mn,du);mx=Math.max(mx,du);}});
  const pad=(mx-mn)*0.04||864e5;mn-=pad;mx+=pad;const span=mx-mn||1;
  const pct=ts=>((ts-mn)/span*100);
  const lc=l=>l==="Squad"?C.squad:l==="Du_an"?C.duan:C.vanhoa;
  const todayPct=pct(today.getTime());
  const ticks=[];const d0=new Date(mn);d0.setDate(1);for(let dd=new Date(d0);dd.getTime()<=mx;dd.setMonth(dd.getMonth()+1))ticks.push(new Date(dd));
  const sorted=[...tasks].sort((a,b)=>(a.due?new Date(a.due).getTime():mx)-(b.due?new Date(b.due).getTime():mx)).slice(0,60);
  const LBL=180;
  return(<div style={{padding:"10px 14px 14px"}}>
    <div style={{display:"flex",gap:14,marginBottom:12,flexWrap:"wrap",fontSize:10,color:"var(--text-4)"}}>
      {[["Squad",C.squad],["Dự án",C.duan],["Văn hóa",C.vanhoa],["Trễ hạn","#FB7185"]].map(([l,cc])=><span key={l} style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:3,background:cc}}/>{l}</span>)}
      <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:2,height:11,background:"#FB7185"}}/>Hôm nay</span>
    </div>
    <div style={{position:"relative"}}>
      <div style={{position:"relative",marginLeft:LBL,height:16,marginBottom:6}}>{ticks.map((t,i)=><span key={i} style={{position:"absolute",left:`${pct(t.getTime())}%`,fontSize:9,color:"var(--text-5)",transform:"translateX(-50%)",whiteSpace:"nowrap",fontWeight:600}}>T{t.getMonth()+1}</span>)}</div>
      <div style={{position:"relative"}}>
        {todayPct>=0&&todayPct<=100&&<div style={{position:"absolute",left:`calc(${LBL}px + (100% - ${LBL}px) * ${todayPct} / 100)`,top:0,bottom:0,width:2,background:"#FB7185",opacity:.55,zIndex:2,pointerEvents:"none"}}/>}
        {sorted.map(t=>{
          const cr=t.created?new Date(t.created).getTime():(t.due?new Date(t.due).getTime():mn);
          const du=t.due?new Date(t.due).getTime():cr;
          const l=Math.max(0,pct(Math.min(cr,du))),w=Math.max(1.5,pct(Math.max(cr,du))-pct(Math.min(cr,du)));
          const overdue=t.due&&new Date(t.due)<today&&getGrp(t.status)?.id!=="closed";
          const done=getGrp(t.status)?.id==="closed";const col=overdue?"#FB7185":lc(t.loai);
          return(<div key={t.key} onClick={()=>onSelect&&onSelect(t)} style={{display:"grid",gridTemplateColumns:`${LBL}px 1fr`,alignItems:"center",height:27,cursor:"pointer",borderRadius:6}} onMouseEnter={e=>e.currentTarget.style.background="var(--fg-03)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <div style={{display:"flex",alignItems:"center",gap:6,paddingRight:10,overflow:"hidden"}}><span style={{fontSize:10,fontWeight:700,color:lc(t.loai),flexShrink:0}}>{t.key}</span><span style={{fontSize:10,color:"var(--text-4)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.hang_muc||""}</span></div>
            <div style={{position:"relative",height:15}}><div title={t.key+" · "+(t.created||"?")+" → "+(t.due||"?")} style={{position:"absolute",left:`${l}%`,width:`${w}%`,height:15,borderRadius:7,background:done?`${col}55`:`linear-gradient(90deg,${col},${col}BB)`,border:`1px solid ${col}`,boxShadow:`0 0 8px ${col}44`,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:4,minWidth:8}}>{done&&<span style={{fontSize:9,color:"#fff",fontWeight:700}}>✓</span>}</div></div>
          </div>);
        })}
      </div>
    </div>
  </div>);
}

// ── Command Palette (Ctrl+K / ⌘K) ───────────────────────────────
function CmdPalette({open,onClose,commands,accent}){
  const[q,setQ]=useState("");
  const[sel,setSel]=useState(0);
  const inRef=useRef(null);
  useEffect(()=>{if(open){setQ("");setSel(0);setTimeout(()=>{if(inRef.current)inRef.current.focus();},30);}},[open]);
  useEffect(()=>{setSel(0);},[q]);
  const list=(()=>{const s=q.trim().toLowerCase();if(!s)return commands.slice(0,80);return commands.filter(c=>(c.label+" "+(c.group||"")+" "+(c.hint||"")).toLowerCase().includes(s)).slice(0,80);})();
  if(!open)return null;
  const onKey=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();setSel(s=>Math.min(s+1,list.length-1));}
    else if(e.key==="ArrowUp"){e.preventDefault();setSel(s=>Math.max(s-1,0));}
    else if(e.key==="Enter"){e.preventDefault();const cc=list[sel];if(cc){cc.run();onClose();}}
    else if(e.key==="Escape"){e.preventDefault();onClose();}
  };
  return(<div onMouseDown={onClose} style={{position:"fixed",inset:0,zIndex:600,background:"rgba(5,7,16,.55)",backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)",display:"flex",alignItems:"flex-start",justifyContent:"center",paddingTop:"11vh"}}>
    <div onMouseDown={e=>e.stopPropagation()} onKeyDown={onKey} style={{width:"min(640px,92vw)",background:"var(--surface-hi)",border:`1px solid ${accent}40`,borderRadius:16,boxShadow:"0 30px 90px rgba(0,0,0,.55)",overflow:"hidden",animation:"cmdIn .18s cubic-bezier(.22,1,.36,1)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 18px",borderBottom:"1px solid var(--fg-06)"}}>
        <span style={{fontSize:15,color:accent,fontWeight:700}}>⌘</span>
        <input ref={inRef} value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm lệnh, bộ lọc, người, trạng thái..." style={{flex:1,background:"transparent",border:"none",outline:"none",color:"var(--text)",fontSize:15,fontFamily:FF}}/>
        <span style={{fontSize:9,color:"var(--text-4)",border:"1px solid var(--fg-08)",borderRadius:5,padding:"2px 6px",fontWeight:600}}>ESC</span>
      </div>
      <div style={{maxHeight:"52vh",overflowY:"auto",padding:6}}>

        {list.map((cc,i)=>(<div key={i} onMouseEnter={()=>setSel(i)} onMouseDown={e=>{e.preventDefault();cc.run();onClose();}} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 12px",borderRadius:10,cursor:"pointer",background:sel===i?`${accent}1F`:"transparent",border:sel===i?`1px solid ${accent}40`:"1px solid transparent"}}>

{focusSection&&<div onMouseDown={()=>setFocusSection(null)} style={{position:"fixed",inset:0,zIndex:650,background:"rgba(5,7,16,.62)",backdropFilter:"blur(5px)",WebkitBackdropFilter:"blur(5px)",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"4vh 4vw",overflow:"auto"}}><div onMouseDown={e=>e.stopPropagation()} style={{width:"100%",maxWidth:1120,background:"var(--bg)",border:"1px solid var(--fg-08)",borderRadius:18,padding:"20px 22px",boxShadow:"0 30px 90px rgba(0,0,0,.6)",animation:"cmdIn .2s cubic-bezier(.22,1,.36,1)"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><span style={{fontSize:13,fontWeight:700,color:"var(--text-hd)",letterSpacing:".5px"}}>🔍 {cfg.sections[focusSection]?.title||focusSection}</span><button onClick={()=>setFocusSection(null)} style={{width:28,height:28,borderRadius:8,background:"var(--fg-05)",border:"1px solid var(--fg-08)",color:"var(--text-3)",cursor:"pointer",fontSize:14}}>✕</button></div><div>{renderSection(focusSection)}</div></div></div>}
<CmdPalette open={showCmd} onClose={()=>setShowCmd(false)} commands={cmdCommands} accent={C.accent}/>
<ToastHost toasts={toasts}/>
{/* NHÓM 5.3: Weekly Summary Modal (Mondays) */}
{showWeeklySummary&&<div onMouseDown={()=>setShowWeeklySummary(false)} style={{position:"fixed",inset:0,zIndex:900,background:"rgba(5,7,16,.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center"}}><div onMouseDown={e=>e.stopPropagation()} style={{background:"var(--elevated)",border:"1px solid var(--fg-08)",borderRadius:20,padding:"28px 32px",width:420,maxWidth:"90vw",boxShadow:"0 40px 100px rgba(0,0,0,.7)",animation:"scaleIn .25s ease"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><div><div style={{fontSize:16,fontWeight:800,color:"var(--text-hd)",marginBottom:2}}>📅 Tổng kết tuần</div><div style={{fontSize:10,color:"var(--text-dimmer)"}}>{prevLabel}</div></div><button onClick={()=>{setShowWeeklySummary(false);try{localStorage.setItem("cm_weekly_"+new Date().toISOString().slice(0,10),"1");}catch{}}} style={{width:28,height:28,borderRadius:8,background:"var(--fg-05)",border:"1px solid var(--fg-08)",color:"var(--text-3)",cursor:"pointer",fontSize:14}}>✕</button></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>{[{label:"Tổng task",val:total,color:C.squad,icon:"📋"},{label:"Hoàn thành",val:grpCount("closed"),color:"#34D399",icon:"✅"},{label:"Đang làm",val:grpCount("inprogress"),color:"#A78BFA",icon:"🔄"},{label:"Trễ hạn",val:overdue,color:C.danger,icon:"⚠️"}].map(m=><div key={m.label} style={{padding:"12px",background:`${m.color}0A`,border:`1px solid ${m.color}22`,borderRadius:12,textAlign:"center"}}><div style={{fontSize:18}}>{m.icon}</div><div style={{fontSize:24,fontWeight:800,color:m.color,margin:"4px 0"}}>{m.val}</div><div style={{fontSize:10,color:"var(--text-4)"}}>{m.label}</div></div>)}</div><div style={{padding:"10px 14px",background:"var(--fg-03)",borderRadius:10,marginBottom:16}}><div style={{fontSize:11,fontWeight:700,color:"var(--text-2)",marginBottom:6}}>🏆 Top performer tuần này</div>{topPerformer?<div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:32,height:32,borderRadius:10,background:AVT_COLORS[dynamicAssignees.indexOf(topPerformer.name)%AVT_COLORS.length]||"#818CF8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,color:"#fff"}}>{topPerformer.av}</div><div><div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{topPerformer.name}</div><div style={{fontSize:10,color:"#34D399"}}>{topPerformer.cr}% hoàn thành · {topPerformer.t} tasks</div></div></div>:<div style={{fontSize:11,color:"var(--text-4)"}}>Chưa có dữ liệu</div>}</div><button onClick={()=>{setShowWeeklySummary(false);try{localStorage.setItem("cm_weekly_"+new Date().toISOString().slice(0,10),"1");}catch{}}} style={{width:"100%",padding:"10px",background:C.accent,border:"none",borderRadius:10,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>Bắt đầu ngày mới 🚀</button></div></div>}
{/* NHÓM 6.3: Present Mode overlay */}
{presentMode&&<div style={{position:"fixed",inset:0,zIndex:850,background:"var(--bg)",padding:"32px 48px",overflow:"auto"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}><div style={{fontSize:22,fontWeight:900,color:"var(--text-hd)",letterSpacing:"-0.5px"}}>📊 SHB Dashboard — Chế độ trình chiếu</div><button onClick={()=>setPresentMode(false)} style={{padding:"8px 16px",background:"var(--fg-05)",border:"1px solid var(--fg-08)",borderRadius:10,color:"var(--text-3)",cursor:"pointer",fontSize:12,fontWeight:600}}>✕ Thoát (P)</button></div><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:20,marginBottom:24}}>{[{lb:"Tổng tasks",val:total,color:C.squad},{lb:"Hoàn thành",val:grpCount("closed"),color:"#34D399"},{lb:"Đang làm",val:grpCount("inprogress"),color:"#A78BFA"},{lb:"Trễ hạn",val:overdue,color:C.danger}].map(m=><div key={m.lb} style={{background:"var(--surface)",border:"1px solid var(--fg-08)",borderRadius:20,padding:"28px 24px",textAlign:"center",boxShadow:"var(--card-glow)"}}><div style={{fontSize:52,fontWeight:900,color:m.color,lineHeight:1,marginBottom:8}}>{m.val}</div><div style={{fontSize:14,color:"var(--text-4)",fontWeight:600}}>{m.lb}</div></div>)}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}><div style={{background:"var(--surface)",border:"1px solid var(--fg-08)",borderRadius:20,padding:"24px"}}><div style={{fontSize:14,fontWeight:700,color:"var(--text-hd)",marginBottom:16}}>📈 Tiến độ theo loại</div><ProgressRings sRate={rS} dRate={rD} vRate={rV} C={C}/></div><div style={{background:"var(--surface)",border:"1px solid var(--fg-08)",borderRadius:20,padding:"24px"}}><div style={{fontSize:14,fontWeight:700,color:"var(--text-hd)",marginBottom:16}}>👥 Workload team</div>{assigneeRows.slice(0,5).map(a=><div key={a.name} style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}><div style={{width:36,height:36,borderRadius:10,background:a.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff"}}>{a.av}</div><div style={{flex:1}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{a.name}</span><span style={{fontSize:13,fontWeight:700,color:a.cr>=70?"#34D399":a.cr>=50?C.accent:C.danger}}>{a.cr}%</span></div><div style={{height:8,background:"var(--fg-05)",borderRadius:99}}><div style={{height:"100%",width:`${a.cr}%`,background:`linear-gradient(90deg,${a.cr>=70?"#34D399":a.cr>=50?C.accent:C.danger},${a.cr>=70?"#34D399":a.cr>=50?C.accent:C.danger}88)`,borderRadius:99}}/></div></div></div>)}</div></div></div>}
{/* Keyboard shortcut hint */}
{!search&&<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",zIndex:100,pointerEvents:"none",animation:"fadeIn .5s ease 2s both"}}><span style={{fontSize:10,color:"var(--text-dimmer)",background:"var(--surface-hi)",border:"1px solid var(--fg-06)",borderRadius:8,padding:"4px 10px"}}>⌘K lệnh nhanh · Ctrl+F / tìm · [ ] dịch kỳ · P trình chiếu · Esc xoá lọc</span></div>}
    </div>
  );
}



const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(DashboardApp));




















</script>
</body>
</html>
