worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Giữ nguyên URL cũ (VBA/userscript/iframe portal không phải đổi) —
    # tương đương phần "rewrites" của vercel.json, chỉ khác đích là file tĩnh
    # hoặc service ingest nội bộ thay vì Vercel function.
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location = /api/facebook { alias /usr/share/nginx/html/api/facebook.html; }
        location = /api/email    { alias /usr/share/nginx/html/api/email.html; }
        location = /api/leader   { alias /usr/share/nginx/html/api/leader.html; }

        # Beacon Email (VBA) + POST userscript Facebook -> Node ingest service thường trực
        location = /api/track {
            proxy_pass http://ingest-service:3001/api/track;
            proxy_set_header Host $host;
        }
        location = /api/ingest {
            proxy_pass http://ingest-service:3001/api/ingest;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
