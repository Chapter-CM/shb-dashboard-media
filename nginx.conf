events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;

    types {
        application/javascript mjs;
    }

    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/wasm;
    gzip_disable "msie6";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 80;
        server_name localhost;

        # Health check
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Portal 3 tab (Email/Facebook/Jira) nhúng iframe same-origin các route dưới —
        # mỗi route là 1 file HTML tĩnh bake sẵn bởi sync.js (không phải SPA đọc data.json
        # như cm-dashboard gốc, vì api/*-dashboard.js đã tự render full HTML + data).
        location = /api/facebook { root /usr/share/nginx/html; try_files /api/facebook.html =404; }
        location = /api/email    { root /usr/share/nginx/html; try_files /api/email.html =404; }
        location = /api/leader   { root /usr/share/nginx/html; try_files /api/leader.html =404; }

        # Beacon Email (VBA) + POST userscript Facebook -> Node ingest service thường trực.
        # ⚠️ TẠM STUB 503: service ingest (cm-dashboard-ingest) CHƯA tồn tại trên cluster.
        # nginx phân giải hostname trong proxy_pass NGAY LÚC KHỞI ĐỘNG — trỏ tới host
        # không resolve được là nginx chết luôn ([emerg] host not found in upstream)
        # => pod crash-loop, 503 toàn site kể cả /health (sự cố 07/07/2026).
        # Khi Quang tạo xong Service ingest + xác nhận đúng tên DNS, khôi phục 2 block
        # proxy_pass như sau (thay <dns-ingest> bằng tên thật):
        #   location = /api/track  { proxy_pass http://<dns-ingest>:3001/api/track;  proxy_set_header Host $host; }
        #   location = /api/ingest { proxy_pass http://<dns-ingest>:3001/api/ingest; proxy_set_header Host $host; proxy_set_header Content-Type $content_type; }
        location = /api/track  { return 503 "ingest service chua trien khai\n"; }
        location = /api/ingest { return 503 "ingest service chua trien khai\n"; }

        # Default - Serve dashboard tĩnh
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
            # No cache cho HTML để luôn thấy bản build mới nhất sau mỗi schedule
            add_header 'Cache-Control' 'no-cache, no-store, must-revalidate' always;
        }
    }
}
